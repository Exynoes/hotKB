databases:
  - name: hotkb-db
    plan: free
    databaseName: hotkb
    user: hotkb

services:
  - type: web
    name: hotkb
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hotkb-db
          property: connectionString
    healthCheckPath: /api/health
