# Base PostgreSQL pour le développement local : `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotkb
    ports:
      - "5432:5432"
    volumes:
      - hotkb-data:/var/lib/postgresql/data
volumes:
  hotkb-data:
